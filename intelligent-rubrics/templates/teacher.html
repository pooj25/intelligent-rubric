<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RubriQ - Teacher</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Teacher Dashboard</h1>
      <p>Create, generate, and manage rubrics.</p>
      <nav class="nav">
        <a href="/">Home</a>
        <a class="active" href="/teacher">Teacher</a>
        <a href="/student">Student</a>
        <a href="/records">Records</a>
        <a href="/analysis">Analysis</a>
        <button type="button" class="theme-toggle" data-theme-toggle>Dark</button>
      </nav>
    </section>

    <section class="card">
      <div class="tabs" id="typeTabs">
        <button class="active" data-type="algorithm">Algorithm</button>
        <button data-type="flowchart">Flowchart</button>
        <button data-type="pseudocode">Pseudocode</button>
      </div>
      <p class="small">Type: <span id="activeType">algorithm</span></p>
    </section>

    <section class="grid">
      <section class="card">
        <h2>Rubric Builder</h2>
        <label for="questionInput">Question</label>
        <textarea id="questionInput" rows="3" placeholder="Write algorithm to add two numbers"></textarea>
        <label for="rubricIdInput">Rubric ID (optional)</label>
        <input id="rubricIdInput" placeholder="algo-add-two-v1" />
        <button id="generateBtn" class="secondary">Generate Draft</button>

        <label for="rubricJson">Rubric JSON</label>
        <textarea id="rubricJson" rows="16"></textarea>
        <button id="saveBtn">Save Rubric</button>
        <p id="status" class="small"></p>
      </section>

      <section class="card">
        <h2>Rubric Cards</h2>
        <div id="cards" class="rubric-cards"></div>
      </section>
    </section>
  </main>
  <script src="/static/theme.js"></script>
  <script src="/static/teacher.js"></script>
</body>
</html>
